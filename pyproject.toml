[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-fusion-tracking"
version = "0.1.0"
description = "Multi-sensor fusion and state estimation (KF/EKF/UKF) for target tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]